name: build-ragflow-v0.26.1-arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout RAGFlow v0.26.1
        uses: actions/checkout@v4
        with:
          repository: infiniflow/ragflow
          ref: v0.26.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download deps
        run: |
          python3 -m pip install -q nltk huggingface-hub
          python3 download_deps.py

      - name: Verify downloaded deps
        run: |
          set -e
          missing=0
          check_file() {
            if [ ! -s "$1" ]; then
              echo "ERROR: 缺少或为空文件 $1"
              missing=1
            fi
          }
          check_dir() {
            if [ ! -d "$1" ] || [ -z "$(ls -A "$1" 2>/dev/null)" ]; then
              echo "ERROR: 缺少或为空目录 $1"
              missing=1
            fi
          }

          check_file chromedriver-linux64-121-0-6167-85
          check_file chrome-linux64-121-0-6167-85
          check_file cl100k_base.tiktoken
          check_file libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          check_file libssl1.1_1.1.1f-1ubuntu2_arm64.deb
          check_file tika-server-standard-3.3.0.jar
          check_file tika-server-standard-3.3.0.jar.md5
          check_file uv-x86_64-unknown-linux-gnu.tar.gz
          check_file uv-aarch64-unknown-linux-gnu.tar.gz

          check_dir nltk_data/corpora/wordnet
          check_dir nltk_data/tokenizers/punkt
          check_dir nltk_data/tokenizers/punkt_tab
          check_dir huggingface.co/InfiniFlow/text_concat_xgb_v1.0
          check_dir huggingface.co/InfiniFlow/deepdoc

          if [ "$missing" -eq 1 ]; then
            echo "--- 当前目录文件列表 ---"
            ls -la
            exit 1
          fi
          echo "所有依赖文件校验通过"
          ls -lh chromedriver-linux64-121-0-6167-85 chrome-linux64-121-0-6167-85 cl100k_base.tiktoken libssl1.1_1.1.1f-1ubuntu2_amd64.deb libssl1.1_1.1.1f-1ubuntu2_arm64.deb tika-server-standard-3.3.0.jar uv-x86_64-unknown-linux-gnu.tar.gz uv-aarch64-unknown-linux-gnu.tar.gz

      - name: Build deps image (temporarily disable .dockerignore)
        run: |
          mv .dockerignore .dockerignore.bak
          docker build -f Dockerfile.deps -t infiniflow/ragflow_deps:latest .
          mv .dockerignore.bak .dockerignore

      - name: Build ragflow image arm64
        run: docker build -f Dockerfile -t ragflow:v0.26.1-arm64 .

      - name: Save and split image
        run: |
          docker save -o ragflow_v0.26.1_arm64.tar ragflow:v0.26.1-arm64
          split -b 1900M -d ragflow_v0.26.1_arm64.tar ragflow_v0.26.1_arm64.tar.part
          ls -lh ragflow_v0.26.1_arm64.tar.part*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragflow-v0.26.1-arm64
          path: ragflow_v0.26.1_arm64.tar.part*
          retention-days: 3
