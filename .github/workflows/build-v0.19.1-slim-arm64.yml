name: build-ragflow-v0.19.1-slim-arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout RAGFlow v0.19.1
        uses: actions/checkout@v4
        with:
          repository: infiniflow/ragflow
          ref: v0.19.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download deps (slim: skip embedding models)
        run: |
          python3 -m pip install -q nltk huggingface-hub
          python3 <<'PYEOF'
          s = open('download_deps.py').read()

          # 1) 补 User-Agent（v0.19.1 缺，archive.ubuntu.com 会 403 默认 urllib UA）
          if 'Mozilla/5.0' not in s:
              anchor = 'urls = get_urls(args.china_mirrors)'
              patch = ("opener = urllib.request.build_opener()\n"
                       "    opener.addheaders = [('User-Agent', 'Mozilla/5.0')]\n"
                       "    urllib.request.install_opener(opener)\n"
                       "    " + anchor)
              s = s.replace(anchor, patch)

          # 2) 把默认源里的 bit.ly 短链换成 [url, 文件名] 形式的 storage.googleapis.com 地址
          s = s.replace('"https://bit.ly/chrome-linux64-121-0-6167-85"',
                        '["https://storage.googleapis.com/chrome-for-testing-public/121.0.6167.85/linux64/chrome-linux64.zip", "chrome-linux64-121-0-6167-85"]')
          s = s.replace('"https://bit.ly/chromedriver-linux64-121-0-6167-85"',
                        '["https://storage.googleapis.com/chrome-for-testing-public/121.0.6167.85/linux64/chromedriver-linux64.zip", "chromedriver-linux64-121-0-6167-85"]')

          # 3) slim 版：去掉内置 embedding 模型（bge-large-zh / bce），310P 用 vLLM 的 bge-m3，无需内置
          s = s.replace('    "BAAI/bge-large-zh-v1.5",\n', '')
          s = s.replace('    "maidalun1020/bce-embedding-base_v1",\n', '')

          open('download_deps.py', 'w').write(s)
          print('patch done')
          PYEOF
          python3 download_deps.py

      - name: Build deps image
        run: |
          test -d huggingface.co || { echo "ERROR: huggingface.co 未下载成功"; ls -la; exit 1; }
          test -d nltk_data || { echo "ERROR: nltk_data 未下载成功"; ls -la; exit 1; }
          docker build -f Dockerfile.deps -t infiniflow/ragflow_deps:latest .

      - name: Build ragflow image arm64 (slim)
        run: docker build --build-arg LIGHTEN=1 -f Dockerfile -t ragflow:v0.19.1-slim-arm64 .

      - name: Save and split image
        run: |
          docker save -o ragflow_v0.19.1_slim_arm64.tar ragflow:v0.19.1-slim-arm64
          split -b 1900M -d ragflow_v0.19.1_slim_arm64.tar ragflow_v0.19.1_slim_arm64.tar.part
          ls -lh ragflow_v0.19.1_slim_arm64.tar.part*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragflow-v0.19.1-slim-arm64
          path: ragflow_v0.19.1_slim_arm64.tar.part*
          retention-days: 3
